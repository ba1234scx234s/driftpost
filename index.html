<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Driftpost" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Driftpost – a calm, private feed reader</title>
    <meta name="description" content="Driftpost is a free, calm RSS reader for blogs and news. No account, no ads, no tracking, no algorithm. Your feeds stay in your browser, never on a server." />
    <link rel="canonical" href="https://driftpost.app/" />

    <!-- Link previews (Facebook, LinkedIn, Slack, iMessage…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Driftpost" />
    <meta property="og:url" content="https://driftpost.app/" />
    <meta property="og:title" content="Driftpost – a calm, private feed reader" />
    <meta property="og:description" content="Driftpost is a free, calm RSS reader for blogs and news. No account, no ads, no tracking, no algorithm. Your feeds stay in your browser, never on a server." />
    <meta property="og:image" content="https://driftpost.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Driftpost open on a laptop: feeds, a list of posts and an article in the reader" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Driftpost – a calm, private feed reader" />
    <meta name="twitter:description" content="Driftpost is a free, calm RSS reader for blogs and news. No account, no ads, no tracking, no algorithm. Your feeds stay in your browser, never on a server." />
    <meta name="twitter:image" content="https://driftpost.app/og-image.jpg" />

    <!-- What Driftpost is, for search engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Driftpost",
        "url": "https://driftpost.app/",
        "description": "Driftpost is a free, calm RSS reader for blogs and news. No account, no ads, no tracking, no algorithm. Your feeds stay in your browser, never on a server.",
        "applicationCategory": "NewsApplication",
        "operatingSystem": "Any (web browser)",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "isAccessibleForFree": true,
        "license": "https://opensource.org/licenses/MIT",
        "codeRepository": "https://github.com/ba1234scx234s/driftpost"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
